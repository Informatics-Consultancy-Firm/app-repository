<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6693">
<meta name="color-scheme" content="light">
<title>ICF-SL App Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Same design as the Private Hospitals and Clinics directory: DHIS2 blue, green frame, phone view.
   Icons: Health Icons (healthicons.org, public domain CC0). */
:root{--bg:#eef2f6;--line:#d5e0eb;--ink:#0b2540;--dhis:#2c6693;--dhis2:#1565c0;--dhis3:#0d47a1;--frame:#009E73;--appw:560px}
*,*::before,*::after{box-sizing:border-box}
html{background:#dfe6ee}
body{margin:0;color:var(--ink);font:400 15px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px 11px 42px;width:100%;appearance:none;-webkit-appearance:none}
input:focus{outline:0;border-color:var(--dhis2);box-shadow:0 0 0 3px rgba(21,101,192,.15)}
::placeholder{color:#6b85a3}
:focus-visible{outline:2px solid var(--dhis2);outline-offset:2px}
svg.i{width:20px;height:20px;flex:0 0 auto}
svg.u{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.appbar{position:sticky;top:0;z-index:20;max-width:var(--appw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px;background:var(--dhis);border-bottom:6px solid var(--frame)}
.icflogo{width:118px;height:66px;border-radius:14px;background:#fff;object-fit:contain;padding:4px 8px;flex:0 0 auto}
.ctx{flex:1;min-width:0;line-height:1.2}
.ctx b{display:block;font-size:20px;color:#fff;font-weight:700}
.ctx small{display:block;font-size:13px;color:#fff;font-weight:500;opacity:.92;margin-top:3px}

/* frame and footer */
.frame{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--appw),100%);border-left:6px solid var(--frame);border-right:6px solid var(--frame);pointer-events:none;z-index:15}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--appw),100%);z-index:20;background:var(--dhis);color:#fff;text-align:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--frame);display:flex;flex-direction:column;gap:2px}
.foot .f1{font-weight:700;font-size:clamp(11px,3.1vw,14px)}
.foot .f2{font-size:clamp(10.5px,3vw,12.5px);opacity:.92}
main{max-width:var(--appw);min-height:100vh;margin:0 auto;background:var(--bg);padding:14px 16px 120px}

.search{position:relative;margin-bottom:6px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--dhis2)}

/* sections */
.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 10px 16px;margin-top:14px}
.sech{display:flex;align-items:center;gap:10px;margin:0 6px 14px}
.sech .sn{width:30px;height:30px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 auto}
.sech h2{flex:1;margin:0;font-size:17px;font-weight:900;color:var(--ink);line-height:1.2}
.sech small{font-size:12.5px;color:#3a5675;font-weight:700;white-space:nowrap}

/* phone home screen: 3 icons per row */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:inherit;text-align:center;min-width:0}
.tile{position:relative;width:min(76px,22vw);aspect-ratio:1/1;border-radius:22%;display:grid;place-items:center;
  background:#fff;border:3px solid var(--c);box-shadow:0 3px 8px rgba(11,37,64,.18);transition:transform .12s}
.tile .logo{width:84%;height:auto;object-fit:contain}
.app:active .tile,.app:hover .tile{transform:scale(.95)}
.tile svg.i{width:58%;height:58%}
.badge{position:absolute;top:-8px;left:-8px;min-width:26px;height:22px;padding:0 6px;border-radius:11px;background:var(--c);color:#fff;font-size:11.5px;font-weight:900;
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(11,37,64,.25)}

.lbl{font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;padding:0 2px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:16px;padding:30px 16px;text-align:center;color:#3a5675;margin-top:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--dhis3);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;display:none;z-index:50;max-width:min(520px,90vw);text-align:center;box-shadow:0 6px 18px rgba(11,37,64,.3)}
@media (max-width:380px){.icflogo{width:96px;height:56px}.ctx b{font-size:17px}.lbl{font-size:11.5px}}

/* menu button and section menu, top right */
.menubtn{width:46px;height:46px;border-radius:14px;border:2px solid #fff;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:0 0 auto}
.menubtn span{display:block;width:22px;height:3px;border-radius:2px;background:#fff;transition:transform .2s,opacity .2s}
.menubtn.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menubtn.open span:nth-child(2){opacity:0}
.menubtn.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.bnav{position:absolute;top:calc(100% + 6px);right:10px;width:min(290px,calc(100vw - 32px));display:none;flex-direction:column;gap:2px;padding:8px;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(11,37,64,.25);outline:3px solid var(--frame);z-index:30}
.bnav.open{display:flex}
.bnav button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;font-size:15px;font-weight:700;text-align:left;color:var(--ink)}
.bnav button:hover{background:#f2f6fa}
.bnav small{display:block;font-size:12px;font-weight:500;color:#3a5675}
.mn{width:32px;height:32px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.mn svg.i{width:22px;height:22px}
.sec{scroll-margin-top:104px}

/* app viewer: the app fills the phone column, with a bar back to the shelf */
.viewer{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--appw),100%);z-index:40;background:#fff;display:none;flex-direction:column}
.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--dhis);border-bottom:4px solid var(--frame);color:#fff;flex:0 0 auto}
.vback{display:flex;align-items:center;gap:4px;color:#fff;font-weight:700;font-size:15px;padding:8px 10px;border-radius:10px;border:2px solid #fff;background:rgba(255,255,255,.12)}
.vback svg.u{width:20px;height:20px}
.vtitle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle b{flex:0 0 auto;font-size:12px;font-weight:900;padding:3px 7px;border-radius:8px;border:2px solid #fff}
.vext{color:#fff;width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.vext svg.u{width:20px;height:20px}
.viewer iframe{flex:1;width:100%;border:0;display:block;background:#fff}
.vload{position:absolute;inset:64px 0 0 0;display:none;align-items:center;justify-content:center;gap:10px;color:var(--dhis3);font-weight:700;background:#fff;pointer-events:none}
.spin{width:24px;height:24px;border:3px solid #cfe0f2;border-top-color:var(--dhis2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.grp{display:flex;align-items:center;gap:8px;margin:20px 6px 12px;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.grp::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--c),transparent)}
.sech+.grp{margin-top:4px}
.bnav{max-height:calc(100vh - 110px);overflow-y:auto}
</style>
</head>

const appIcon = () => `<img class="logo" src="${APPICON}" alt="">`;
const ic = k => `<svg class="i" viewBox="0 0 48 48" fill="none" aria-hidden="true">${ICONS[k]||ICONS['symbols/hospital-symbol']}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2400)}

function render(){
  const q=$('q').value.trim().toLowerCase();
  let n=0,total=0,shown=0;
  const html=SECTIONS.map((s,si)=>{
    const groups=(s.groups||[{name:'',apps:s.apps}]).map(g=>({name:g.name,apps:g.apps.map(a=>({...a,n:++n}))}));
    const count=groups.reduce((t,g)=>t+g.apps.length,0);total+=count;
    const ready=groups.reduce((t,g)=>t+g.apps.filter(a=>a.file).length,0);
    const shownGroups=groups.map(g=>({name:g.name,list:g.apps.filter(a=>!q||[a.name,g.name,s.name].join(' ').toLowerCase().includes(q))})).filter(g=>g.list.length);
    const nShown=shownGroups.reduce((t,g)=>t+g.list.length,0);shown+=nShown;
    if(!nShown)return '';
    const tile=a=>{const nn=String(a.n).padStart(2,'0');return a.file
        ?`<a class="app" href="${esc(a.file)}" data-open="${a.n}" aria-label="App ${nn}: ${esc(a.name)}"><span class="tile">${appIcon()}<span class="badge">${nn}</span></span><span class="lbl">${esc(a.name)}</span></a>`
        :`<button class="app soon" data-name="${esc(a.name)}" aria-label="App ${nn}: ${esc(a.name)}, coming soon"><span class="tile">${appIcon()}<span class="badge">${nn}</span></span><span class="lbl">${esc(a.name)}</span></button>`};
    return `<section class="sec" id="sec${si+1}" style="--c:${s.c};--c2:${s.c2}">
      <div class="sech"><span class="sn">${si+1}</span><h2>${esc(s.name)}</h2><small>${s.groups?ready+' of '+count+' ready':count+' app'+(count===1?'':'s')}</small></div>
      ${shownGroups.map(g=>`${g.name?`<h3 class="grp">${esc(g.name)}</h3>`:''}<div class="grid">${g.list.map(tile).join('')}</div>`).join('')}
    </section>`}).join('');
  $('sub').textContent=`${SECTIONS.length} sections · ${total} apps`;
  $('shelf').innerHTML=html||'<div class="empty">No app matches your search.</div>';
  $('shelf').querySelectorAll('.app.soon').forEach(b=>b.onclick=()=>toast(b.dataset.name+' is coming soon'));
  $('shelf').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openApp(+a.dataset.open)});
}
/* menu at the top right: jump to a section */
$('bnav').innerHTML=`<button data-go="top"><span class="mn" style="--c:#2c6693">${ic('symbols/ui-menu_grid')}</span><span>All apps</span></button>`+
  SECTIONS.map((s,i)=>`<button data-go="sec${i+1}"><span class="mn" style="--c:${s.c}">${i+1}</span><span>${esc(s.name)}<small>${s.groups?s.groups.reduce((t,g)=>t+g.apps.length,0):s.apps.length} apps</small></span></button>`).join('');
const closeMenu=()=>{$('bnav').classList.remove('open');$('menuBtn').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')};
$('menuBtn').onclick=e=>{e.stopPropagation();const o=$('bnav').classList.toggle('open');$('menuBtn').classList.toggle('open',o);$('menuBtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!$('bnav').contains(e.target))closeMenu()});
$('bnav').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeMenu();
  if(b.dataset.go==='top'){window.scrollTo({top:0,behavior:'smooth'});return}
  if($('q').value){$('q').value='';render()}
  const el=$(b.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
$('q').addEventListener('input',render);

/* ===== apps open inside the shelf, with their own link (#app01) so the phone back button works ===== */
const ALL=()=>{let n=0;return SECTIONS.flatMap(s=>(s.groups?s.groups.flatMap(g=>g.apps):s.apps).map(a=>({...a,n:++n,sec:s})))};
function openApp(n,fromHash){
  const a=ALL().find(x=>x.n===n);if(!a||!a.file){if(a)toast(a.name+' is coming soon');return}
  const nn=String(n).padStart(2,'0');
  if(!fromHash)history.pushState(null,'','#app'+nn);
  $('vTitle').innerHTML=`<b style="background:${a.sec.c}">${nn}</b>${esc(a.name)}`;
  $('vExt').href=a.file;$('vLoad').style.display='flex';
  /* a fresh frame for each app, so opening an app adds nothing to the back history */
  const old=$('vFrame');if(old)old.remove();
  const f=document.createElement('iframe');f.id='vFrame';f.title=a.name;f.allowFullscreen=true;
  f.setAttribute('allow','geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen');
  f.onload=()=>$('vLoad').style.display='none';f.src=a.file;$('viewer').appendChild(f);
  $('viewer').classList.add('on');$('viewer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function closeApp(){$('viewer').classList.remove('on');$('viewer').setAttribute('aria-hidden','true');document.body.style.overflow='';const f=$('vFrame');if(f)f.remove()}
$('vBack').onclick=()=>{closeApp();if(location.hash)history.replaceState(null,'',location.pathname+location.search)};
function route(){const m=location.hash.match(/^#app(\d+)$/);if(m)openApp(+m[1],true);else if($('viewer').classList.contains('on'))closeApp()}
window.addEventListener('popstate',route);
render();
route();
</script>
